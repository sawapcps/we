name = "multi-chain-rpc-proxy"
main = "src/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ✅ RPC URLs (يقرأها worker.js من env)
[vars]
RPC_URLS = '{"solana":["https://api.mainnet-beta.solana.com"],"ethereum":["https://eth.llamarpc.com"]}'

# ✅ إعدادات قاعدة البيانات D1
[[d1_databases]]
binding = "DB"
database_name = "madartech_platform"
database_id = "1e57a5a3-8705-4b28-ad17-7b7a1e5c7fa6"

# ✅ تشغيل البوت كل 5 دقائق
[triggers]
crons = ["*/5 * * * *"]

# ✅ حدود الـ Worker
[limits]
cpu_ms = 50
