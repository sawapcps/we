name = "multi-chain-rpc-proxy"
main = "src/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# 🗄️ قاعدة البيانات D1
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "madartech_platform"
database_id = "1e57a5a3-8705-4b28-ad17-7b7a1e5c7fa6"

# ============================================================
# ⏰ المجدول (Scheduled Triggers)
# ============================================================
[triggers]
crons = ["*/5 * * * *"]

# ============================================================
# 🔑 المفاتيح العامة (Variables)
# ============================================================
[vars]
ANKR_KEY = "09b7e44361c77ac1a37f6e79b3f67fc6b06a132f1a3e2ae050c70ca6c8f17d24"
HELIUS_KEY = "b25376b4-641e-4912-81f5-652e62a61942"

# ============================================================
# ⚙️ إعدادات البيئة
# ============================================================
[env.production]
vars = { ENVIRONMENT = "production" }