name = "multi-chain-rpc-proxy"
main = "src/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# 🗄️ قاعدة البيانات D1
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "madartech_platform"
database_id = "1e57a5a3-8705-4b28-ad17-7b7a1e5c7fa6"
preview_database_id = "1e57a5a3-8705-4b28-ad17-7b7a1e5c7fa6"

# ============================================================
# ⏰ المجدول (Scheduled Triggers)
# ============================================================
[triggers]
crons = ["*/5 * * * *"]

# ============================================================
# 🔑 المفاتيح العامة - الآن فارغة!
# ============================================================
[vars]
# جميع المفاتيح تم نقلها إلى wrangler secrets

# ============================================================
# ⚙️ إعدادات البيئة
# ============================================================
[env.production]
vars = { ENVIRONMENT = "production" }